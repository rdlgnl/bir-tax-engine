<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 1000px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E3E7EC; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
    <div style="width: 34px; height: 34px; border-radius: 10px; background: #0F172A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15V9"/><path d="M12 15V5"/><path d="M18 15v-3"/></svg></div>
    <span style="font-size: 17px; font-weight: 800">BuwisBuddy</span>
  </div>
  <a href="DesktopDashboard.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{homeBg}}; color: {{homeFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Home</a>
  <a href="DeskTransactions.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{txBg}}; color: {{txFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Transactions</a>
  <a href="DeskTax.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{taxBg}}; color: {{taxFg}}; font-size: 14px; font-weight: 700; text-decoration: none">My tax</a>
  <a href="DeskCompliance.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{compBg}}; color: {{compFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Compliance &amp; 2307s</a>
  <a href="DeskCalendar.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{calBg}}; color: {{calFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Calendar</a>
  <a href="DeskFiling.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{filBg}}; color: {{filFg}}; font-size: 14px; font-weight: 700; text-decoration: none">File a return</a>
  <a href="DeskHistory.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{histBg}}; color: {{histFg}}; font-size: 14px; font-weight: 700; text-decoration: none">History &amp; reports</a>
  <a href="DeskAssistant.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{askBg}}; color: {{askFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Ask</a>
  <a href="DeskProfile.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 10px; background: {{meBg}}; color: {{meFg}}; font-size: 14px; font-weight: 700; text-decoration: none">Profile &amp; settings</a>
  <div style="margin-top: 24px; padding: 14px 12px; border-radius: 12px; background: #F4F6F8; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 800; color: #475569; letter-spacing: 0.4px">NEXT DEADLINE</span>
    <span style="font-size: 15px; font-weight: 800">Mon, Nov 16</span>
    <span style="font-size: 13px; color: #475569">Q3 1701Q · ₱14,000</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","transactions","tax","compliance","calendar","filing","history","ask","me"],"default":"home"},"$preview":{"width":260,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const bg = (k) => (a === k ? '#E8EEFD' : 'transparent');
    const fg = (k) => (a === k ? '#1E3A8A' : '#334155');
    return {
      homeBg: bg('home'), homeFg: fg('home'),
      txBg: bg('transactions'), txFg: fg('transactions'),
      taxBg: bg('tax'), taxFg: fg('tax'),
      compBg: bg('compliance'), compFg: fg('compliance'),
      calBg: bg('calendar'), calFg: fg('calendar'),
      filBg: bg('filing'), filFg: fg('filing'),
      histBg: bg('history'), histFg: fg('history'),
      askBg: bg('ask'), askFg: fg('ask'),
      meBg: bg('me'), meFg: fg('me')
    };
  }
}
</script>
</body>
</html>
