<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App lock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E40AF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F172A; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 72px 32px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px">
  <div style="width: 56px; height: 56px; border-radius: 16px; background: #1E293B; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Enter your PIN</h1>
    <span style="font-size: 14px; color: #CBD5E1">BuwisBuddy is locked</span>
  </div>
  <div role="status" aria-label="{{dotsLabel}}" style="display: flex; gap: 14px; height: 18px">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
      <span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #CBD5E1; background: {{d.bg}}"></span>
    </sc-for>
  </div>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 28px; border-radius: 12px; background: #FFFFFF; color: #0F172A; font-size: 15px; font-weight: 800; text-decoration: none">Unlocked · open the app</a>
  </sc-if>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 270px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="height: 66px; border-radius: 33px; border: 0; background: {{k.bg}}; color: #FFFFFF; font: inherit; font-size: 24px; font-weight: 700">{{k.label}}</button>
    </sc-for>
  </div>
  <button type="button" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #475569; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c0 3-1 6-3 8"/><path d="M8 7a6 6 0 0 1 10 4c0 2 0 4-1 6"/><path d="M5 10a8 8 0 0 1 1-3"/><path d="M12 15c0 2-.5 4-1.5 5"/></svg>
    Use fingerprint
  </button>
  <a href="DataSettings.dc.html" style="margin-top: auto; font-size: 13px; font-weight: 600; color: #BFDBFE; text-decoration: none; text-align: center; padding: 8px">Forgot PIN? Restore a backup on a fresh install</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 0 }; }
  renderVals() {
    const n = this.state.n;
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    const keys = labels.map((l) => ({
      label: l,
      aria: l === '⌫' ? 'Delete' : l === '' ? 'Empty' : 'Digit ' + l,
      bg: l === '' ? 'transparent' : '#1E293B',
      press: () => {
        if (l === '') return;
        if (l === '⌫') this.setState({ n: Math.max(0, n - 1) });
        else this.setState({ n: Math.min(4, n + 1) });
      }
    }));
    const dots = [0, 1, 2, 3].map((i) => ({ bg: i < n ? '#FFFFFF' : 'transparent' }));
    return { keys, dots, done: n === 4, dotsLabel: n + ' of 4 digits entered' };
  }
}
</script>
</body>
</html>
