<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 32px">
  <div style="display: flex; align-items: center; gap: 12px; height: 48px">

  </div>

  <h1 style="margin: 24px 0 8px; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -0.5px">A bit about you</h1>
  <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: #475569">We'll fill in the rest from your BIR certificate on the next step.</p>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fullname" style="font-size: 14px; font-weight: 700">Your full name</label>
      <input id="fullname" value="Juan Dela Cruz" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CBD2DA; font: inherit; font-size: 16px; color: #0F172A">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="trade" style="font-size: 14px; font-weight: 700">Business or trade name <span style="font-weight: 500; color: #475569">(optional)</span></label>
      <input id="trade" placeholder="e.g. JDC Design Studio" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CBD2DA; font: inherit; font-size: 16px; color: #0F172A">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="work" style="font-size: 14px; font-weight: 700">What do you do, in a few words?</label>
      <input id="work" value="Freelance graphic design" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CBD2DA; font: inherit; font-size: 16px; color: #0F172A">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="city" style="font-size: 14px; font-weight: 700">City where you work</label>
      <input id="city" value="Caloocan City" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CBD2DA; font: inherit; font-size: 16px; color: #0F172A">
    </div>
  </form>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Are you registered with the BIR?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="OnbCorScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; border: 2px solid #1D4ED8; background: #F5F8FF; font-size: 15px; font-weight: 700; color: #0F172A; text-decoration: none">Yes, I have a COR</a>

    </div>
    <span style="font-size: 13px; line-height: 1.45; color: #475569">Not yet? We'll give you a checklist for registering (Form 1901) and keep your estimates ready.</span>
  </div>

  <a href="OnbCorScan.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1D4ED8; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">Continue</a>
</div>
